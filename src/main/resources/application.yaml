spring:
  application:
    name: Troubleshooting
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:task-db
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8080
logging:
  level:
    root: INFO
    ru.rogotovsky.troubleshooting: DEBUG
    ru.rogotovsky.troubleshooting.service.TaskService: TRACE
management:
  endpoints:
    web:
      exposure:
        include: "*"